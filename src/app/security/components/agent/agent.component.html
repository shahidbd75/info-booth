<form [formGroup]="formGroup">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Agent Entry</mat-card-title>
      <mat-card-subtitle>Security</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-divider></mat-divider>
      <div class="g-3 pt-2">
        <div class="row">
          <div class="col-md-4 col-xs-12">
            <label for="name" class="form-label">Name</label>
            <span class="text-danger">*</span>
            <input type="text" formControlName="name" class="form-control" id="name" />
          </div>
          <div class="col-md-4 col-xs-12">
            <label for="banglaName" class="form-label">Phone</label>
            <span class="text-danger">*</span>
            <input type="text" formControlName="phone" class="form-control" id="banglaName" />
          </div>
          <div class="col-md-4 col-xs-12">
            <label for="district" class="form-label">District</label>
            <ng-select
              [items]="districts$ | async"
              id="districtId"
              [searchable]="true"
              bindValue="id"
              bindLabel="name"
              formControlName="districtId"
              (change)="loadUpazilas()"
              placeholder="Please select district"></ng-select>
          </div>
          <div class="col-md-4 col-xs-12">
            <label for="upazila" class="form-label">Upazila</label>
            <ng-select
              [items]="upazilas$ | async"
              id="upazila"
              [searchable]="true"
              bindValue="id"
              bindLabel="name"
              formControlName="upazilaId"
              placeholder="Please select upazila"></ng-select>
          </div>
        </div>
      </div>
    </mat-card-content>
    <mat-card-actions class="action-button-container">
      <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!formGroup.valid" *ngIf="!isEditMode">Add</button>
      <button mat-raised-button color="primary" (click)="onUpdate()" [disabled]="!formGroup.valid" *ngIf="isEditMode">Update</button>
      <button mat-raised-button (click)="resetForm()">Cancel</button>
    </mat-card-actions>
  </mat-card>
</form>
