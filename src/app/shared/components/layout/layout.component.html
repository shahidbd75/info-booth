<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false">
    <mat-toolbar>
      <span [routerLink]="['.']" class="home">Dashboard</span>
    </mat-toolbar>
    <mat-nav-list>
      <a mat-list-item *ngFor="let nav of contextService.menus$ | async" routerLink="{{ nav.link }}">{{ nav.text }}</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()" *ngIf="isHandset$ | async">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span>infoBooth</span>

      <span class="spacer"></span>
      @if (authDataService.authenticateUserSig()) {
        <button mat-button [matMenuTriggerFor]="menu">{{ authDataService.authenticateUserSig()?.name }}</button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item>Profile</button>
          <button mat-menu-item>Settings</button>
          <button mat-menu-item (click)="onLogOutClick()">Logout</button>
        </mat-menu>
      } @else {
        <a [routerLink]="['login']" *ngIf="authDataService.authenticateUserSig() === null || undefined">Login</a>
      }
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
